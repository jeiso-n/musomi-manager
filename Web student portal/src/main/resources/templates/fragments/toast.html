<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="toast(message, type)" 
     hx-swap-oob="beforeend:#toast-container"
     th:class="'p-4 rounded-lg shadow-md border flex items-start gap-3 transition-all duration-300 ' + 
               (${type} == 'success' ? 'bg-emerald-50 border-emerald-200 text-emerald-800' : 
               (${type} == 'error' ? 'bg-red-50 border-red-200 text-red-800' : 'bg-indigo-50 border-indigo-200 text-indigo-800'))">
    <i th:data-lucide="${type == 'success' ? 'check-circle' : (type == 'error' ? 'alert-circle' : 'info')}"
       class="w-5 h-5 shrink-0 mt-0.5"
       th:classappend="${type == 'success' ? 'text-emerald-600' : (type == 'error' ? 'text-red-600' : 'text-indigo-600')}"></i>
    <div class="flex-grow text-sm font-medium" th:text="${message}">Message</div>
    <button type="button" class="shrink-0 p-1 rounded hover:bg-black/5" onclick="this.parentElement.remove()">
        <i data-lucide="x" class="w-4 h-4 text-slate-500"></i>
    </button>
</div>
</body>
</html>
