<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/base :: layout(~{::main})}">
<head>
    <title>My Results</title>
</head>
<body>
<main>
    <!-- Segmented Control: Marks vs Results -->
    <div class="flex p-1 bg-slate-200/80 rounded-xl mb-6 max-w-xs mx-auto shadow-inner">
        <a th:href="@{/student/marks}" 
           class="flex-1 py-1.5 text-xs font-semibold text-center rounded-lg text-slate-600 hover:text-slate-900 transition">
            Marks
        </a>
        <a th:href="@{/student/results}" 
           class="flex-1 py-1.5 text-xs font-semibold text-center rounded-lg shadow-sm bg-white text-indigo-700 transition">
            Summary & Results
        </a>
    </div>

    <!-- Header -->
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-6">
        <div>
            <h1 class="text-2xl font-bold text-slate-900 tracking-tight">Term Summary & Results</h1>
            <p class="text-xs sm:text-sm text-slate-500 mt-0.5">
                <span th:text="${termName != null ? termName : 'Term 1'}">Term 1</span>, 
                <span th:text="${year != null ? year : '2026'}">2026</span> Academic Performance
            </p>
        </div>
        <a th:href="@{/student/reports}" 
           class="inline-flex items-center gap-1.5 px-3.5 py-2 text-xs font-semibold rounded-lg bg-indigo-50 text-indigo-700 border border-indigo-200 hover:bg-indigo-100 transition self-start sm:self-auto">
            <i data-lucide="file-text" class="w-4 h-4"></i>
            Official Report Card
        </a>
    </div>

    <!-- Overall Summary Banner -->
    <div class="bg-gradient-to-br from-indigo-900 via-indigo-800 to-indigo-950 text-white rounded-2xl p-5 sm:p-6 mb-6 shadow-md">
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-4 divide-y sm:divide-y-0 sm:divide-x divide-indigo-700/60">
            <!-- Overall Average -->
            <div class="pt-2 sm:pt-0">
                <span class="text-xs font-medium text-indigo-200 uppercase tracking-wider">Overall Average</span>
                <div class="flex items-baseline gap-2 mt-1.5">
                    <span class="text-3xl font-bold font-mono tabular-nums" th:text="${overallAverage != null ? overallAverage : '81.4'}">81.4</span>
                    <span class="text-indigo-300 text-sm">%</span>
                </div>
            </div>

            <!-- Overall Grade -->
            <div class="pt-2 sm:pt-0 sm:pl-4">
                <span class="text-xs font-medium text-indigo-200 uppercase tracking-wider">Overall Grade</span>
                <div class="mt-1.5">
                    <span class="inline-flex items-center px-3 py-1 rounded-full text-sm font-bold font-mono bg-emerald-500 text-white shadow-sm"
                          th:text="${overallGrade != null ? overallGrade : 'A'}">A</span>
                </div>
            </div>

            <!-- Position -->
            <div class="pt-2 sm:pt-0 sm:pl-4">
                <span class="text-xs font-medium text-indigo-200 uppercase tracking-wider">Class Rank</span>
                <div class="mt-1.5 text-2xl font-bold font-mono tabular-nums">
                    <span th:text="${position != null ? position : '4'}">4</span>
                    <span class="text-xs text-indigo-300 font-normal">of <span th:text="${classSize != null ? classSize : '42'}">42</span></span>
                </div>
            </div>

            <!-- Subjects Count -->
            <div class="pt-2 sm:pt-0 sm:pl-4">
                <span class="text-xs font-medium text-indigo-200 uppercase tracking-wider">Subjects</span>
                <div class="mt-1.5 text-2xl font-bold font-mono tabular-nums" th:text="${subjects != null ? #lists.size(subjects) : '8'}">
                    8
                </div>
            </div>
        </div>
    </div>

    <!-- Subject Performance Breakdown -->
    <div class="mb-8">
        <h2 class="text-lg font-semibold text-slate-900 mb-3">Subject Performance</h2>

        <div th:if="${#lists.isEmpty(subjects)}" 
             th:replace="~{fragments/empty-state :: empty('No subject summaries', 'Subject averages will appear here once term marks are calculated.')}">
        </div>

        <div th:unless="${#lists.isEmpty(subjects)}" class="space-y-3">
            <div th:each="sub : ${subjects}" 
                 class="bg-white rounded-xl p-4 sm:p-5 border border-slate-200 shadow-sm hover:shadow-md transition">
                <div class="flex items-center justify-between gap-3 mb-2.5">
                    <div class="min-w-0">
                        <div class="flex items-center gap-2">
                            <span class="font-semibold text-sm sm:text-base text-slate-900" th:text="${sub.subjectName}">Mathematics</span>
                            <span class="text-xs text-slate-400 font-mono" th:if="${sub.subjectCode != null}" th:text="'(' + ${sub.subjectCode} + ')'">(MTH)</span>
                        </div>
                        <span class="text-xs text-slate-500" th:text="${(sub.assessmentCount != null ? sub.assessmentCount : '2') + ' published assessment(s)'}">3 assessments</span>
                    </div>

                    <div class="flex items-center gap-3 text-right shrink-0">
                        <div class="font-mono text-base sm:text-lg font-bold text-slate-900 tabular-nums">
                            <span th:text="${#numbers.formatDecimal(sub.average, 1, 1)}">84.5</span>%
                        </div>
                        <div th:replace="~{fragments/grade-badge :: badge(${sub.grade})}"></div>
                    </div>
                </div>

                <!-- Visual score progress bar -->
                <div class="w-full bg-slate-100 rounded-full h-2 overflow-hidden">
                    <div class="h-full rounded-full transition-all duration-500"
                         th:style="'width: ' + ${sub.average} + '%;'"
                         th:classappend="${
                            sub.average >= 80 ? 'bg-emerald-500' :
                            (sub.average >= 70 ? 'bg-indigo-600' :
                            (sub.average >= 60 ? 'bg-blue-500' :
                            (sub.average >= 50 ? 'bg-amber-500' : 'bg-red-500')))
                         }">
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
