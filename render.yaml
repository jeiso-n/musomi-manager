# Render Blueprint for Musomi Manager.
#
# The web service runs the Spring Boot backend (which also serves the Thymeleaf
# student portal) from ./backend/Dockerfile. The database is Render Postgres.
#
# Demo note: SPRING_FLYWAY_LOCATIONS includes db/dev-seed so the demo school,
# 50 students, admin and teacher accounts are created. Remove that env var for a
# clean production database, then bootstrap a school/admin another way.
databases:
  - name: musomi-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "16"

services:
  - type: web
    name: musomi-manager
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SPRING_FLYWAY_LOCATIONS
        value: classpath:db/migration,classpath:db/dev-seed
      - key: DATABASE_URL
        fromDatabase:
          name: musomi-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: REPORT_STORAGE_DIR
        value: /tmp/reports
