# Production profile. All secrets and database coordinates are supplied by the deployment environment.
# The application intentionally fails to start if any required value is missing.
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.flyway.enabled=true
# Production excludes db/dev-seed so fresh school databases never receive demo records.
spring.flyway.locations=classpath:db/migration
# Existing local/dev databases may already record V099 and the dev-only repeatable seed migration; ignore unresolved dev-only migrations.
spring.flyway.ignore-migration-patterns=*:missing

# Absolute path on persistent storage; include this directory in the backup plan.
musomi.reports.storage-dir=${REPORT_STORAGE_DIR}

logging.level.root=INFO
logging.level.com.musomi=INFO
logging.level.org.springframework.security=WARN

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=28800000
