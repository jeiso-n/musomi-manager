<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/base :: layout(~{::main})}">
<head>
    <title>Student Dashboard</title>
</head>
<body>
<main>
    <!-- Welcome Header -->
    <div class="mb-6">
        <div class="flex items-start justify-between">
            <div>
                <h1 class="text-2xl font-semibold text-slate-900 tracking-tight">
                    Hello, <span th:text="${firstName != null ? firstName : 'Student'}">Sarah</span> 👋
                </h1>
                <p class="text-slate-500 text-sm font-medium mt-1">
                    <span th:text="${currentTerm != null ? currentTerm : 'Term 1'}">Term 1</span> &middot; 
                    <span th:text="${currentYear != null ? currentYear : '2026'}">2026</span> &middot; 
                    <span th:text="${(className != null ? className : 'Senior 3') + ' ' + (streamName != null ? streamName : 'Blue')}">Senior 3 Blue</span>
                </p>
            </div>
            <span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-mono font-medium bg-indigo-50 text-indigo-700 border border-indigo-100"
                  th:text="${admissionNumber != null ? admissionNumber : 'SMSS/2024/0142'}">
                SMSS/2024/0142
            </span>
        </div>
    </div>

    <!-- Quick Stats Metric Cards -->
    <div class="grid grid-cols-2 gap-3 sm:gap-4 mb-6">
        <!-- Average Card -->
        <div class="bg-white rounded-xl p-4 sm:p-5 border border-slate-200 shadow-sm flex flex-col justify-between">
            <span class="text-xs font-medium uppercase tracking-wider text-slate-500">Overall Average</span>
            <div class="flex items-end justify-between mt-3">
                <div class="text-2xl sm:text-3xl font-semibold font-mono text-slate-900 tabular-nums">
                    <span th:text="${average != null ? average : '82.5'}">82.5</span><span class="text-sm font-sans text-slate-400 font-normal">%</span>
                </div>
                <div th:replace="~{fragments/grade-badge :: badge(${overallGrade != null ? overallGrade : 'A'})}"></div>
            </div>
        </div>

        <!-- Position Card -->
        <div class="bg-white rounded-xl p-4 sm:p-5 border border-slate-200 shadow-sm flex flex-col justify-between">
            <span class="text-xs font-medium uppercase tracking-wider text-slate-500">Class Position</span>
            <div class="mt-3">
                <div class="text-2xl sm:text-3xl font-semibold font-mono text-slate-900 tabular-nums">
                    <span th:text="${position != null ? position : '4'}">4</span>
                    <span class="text-xs sm:text-sm font-sans text-slate-400 font-normal ml-1">of <span th:text="${classSize != null ? classSize : '42'}">42</span></span>
                </div>
            </div>
        </div>
    </div>

    <!-- Quick Navigation Shortcuts -->
    <div class="grid grid-cols-2 sm:grid-cols-3 gap-3 mb-8">
        <a th:href="@{/student/marks}" 
           class="flex items-center gap-3 p-3.5 bg-white hover:bg-indigo-50/50 rounded-xl border border-slate-200 shadow-sm transition group">
            <div class="w-9 h-9 rounded-lg bg-indigo-50 group-hover:bg-indigo-100 flex items-center justify-center text-indigo-600 transition">
                <i data-lucide="clipboard-list" class="w-5 h-5"></i>
            </div>
            <div>
                <div class="text-sm font-semibold text-slate-900">My Marks</div>
                <div class="text-xs text-slate-500">By subject</div>
            </div>
        </a>

        <a th:href="@{/student/results}" 
           class="flex items-center gap-3 p-3.5 bg-white hover:bg-emerald-50/50 rounded-xl border border-slate-200 shadow-sm transition group">
            <div class="w-9 h-9 rounded-lg bg-emerald-50 group-hover:bg-emerald-100 flex items-center justify-center text-emerald-600 transition">
                <i data-lucide="bar-chart-2" class="w-5 h-5"></i>
            </div>
            <div>
                <div class="text-sm font-semibold text-slate-900">Term Results</div>
                <div class="text-xs text-slate-500">Rankings & summary</div>
            </div>
        </a>

        <a th:href="@{/student/reports}" 
           class="col-span-2 sm:col-span-1 flex items-center gap-3 p-3.5 bg-white hover:bg-amber-50/50 rounded-xl border border-slate-200 shadow-sm transition group">
            <div class="w-9 h-9 rounded-lg bg-amber-50 group-hover:bg-amber-100 flex items-center justify-center text-amber-600 transition">
                <i data-lucide="file-text" class="w-5 h-5"></i>
            </div>
            <div>
                <div class="text-sm font-semibold text-slate-900">Report Cards</div>
                <div class="text-xs text-slate-500">PDF downloads</div>
            </div>
        </a>
    </div>

    <!-- Recent Marks Section -->
    <div class="mb-6">
        <div class="flex items-center justify-between mb-3.5">
            <h2 class="text-lg font-semibold text-slate-900">Recent Assessments</h2>
            <a th:href="@{/student/marks}" class="text-xs font-semibold text-indigo-600 hover:text-indigo-800 transition">View all marks &rarr;</a>
        </div>

        <!-- Empty state fallback -->
        <div th:if="${#lists.isEmpty(recentMarks)}" 
             th:replace="~{fragments/empty-state :: empty('No marks published yet', 'Your marks will appear here once your subject teachers grade and publish them.')}">
        </div>

        <!-- Marks List -->
        <div th:unless="${#lists.isEmpty(recentMarks)}" class="space-y-2.5">
            <div th:each="mark : ${recentMarks}" 
                 class="block bg-white rounded-xl p-4 border border-slate-200 shadow-sm hover:border-indigo-200 hover:shadow-md transition">
                <div class="flex items-start justify-between gap-3">
                    <div class="min-w-0 flex-1">
                        <div class="flex items-center gap-2 mb-1">
                            <span class="font-semibold text-sm text-slate-900 truncate" th:text="${mark.subjectName}">Mathematics</span>
                            <span class="inline-flex items-center px-2 py-0.5 rounded text-[10px] font-medium uppercase tracking-wider bg-slate-100 text-slate-600"
                                  th:text="${mark.type}">TEST</span>
                        </div>
                        <div class="text-xs text-slate-600 truncate" th:text="${mark.title}">End of Unit Test</div>
                        <div class="flex items-center gap-2 mt-1 text-[11px] text-slate-400">
                            <i data-lucide="calendar" class="w-3 h-3"></i>
                            <span th:text="${mark.date}">15 Mar 2026</span>
                            <span th:if="${mark.topicName != null}">&middot;</span>
                            <span th:if="${mark.topicName != null}" class="text-indigo-600" th:text="${mark.topicName}">Topic</span>
                        </div>
                    </div>
                    <div class="text-right shrink-0">
                        <div class="font-mono font-semibold text-base text-slate-900 tabular-nums">
                            <span th:text="${mark.score}">85</span><span class="text-xs text-slate-400 font-normal">/<span th:text="${mark.maxScore}">100</span></span>
                        </div>
                        <div class="mt-1">
                            <div th:replace="~{fragments/grade-badge :: badge(${mark.grade})}"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
