<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/base :: layout(~{::main})}">
<head>
    <title>Report Cards</title>
</head>
<body>
<main>
    <div class="mb-6">
        <p class="text-[11px] font-semibold uppercase tracking-[0.16em] text-blue-600 mb-1.5">Documents</p>
        <h1 class="text-2xl sm:text-3xl font-semibold text-slate-900 tracking-tight">Official Report Cards</h1>
        <p class="text-xs sm:text-sm text-slate-500 mt-1">Download and view authenticated term performance reports generated by your school.</p>
    </div>

    <!-- Empty State -->
    <div th:if="${#lists.isEmpty(reports)}"><div th:replace="~{fragments/empty-state :: empty-state('file-text', 'No report cards published', 'Official PDF report cards are published at the end of each academic term.')}"></div></div>

    <!-- Reports Cards List -->
    <div th:unless="${#lists.isEmpty(reports)}" class="space-y-3 stagger">
        <div th:each="report : ${reports}" class="card card-hover p-4 sm:p-5 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div class="flex items-start gap-3.5">
                <div class="w-11 h-11 rounded-xl bg-blue-50 text-blue-600 flex items-center justify-center shrink-0 border border-blue-100">
                    <i data-lucide="file-text" class="w-5 h-5"></i>
                </div>
                <div>
                    <h2 class="font-semibold text-base text-slate-900 leading-tight">
                        <span th:text="${report.termName}">Term 1</span> Report Card &middot; <span th:text="${report.academicYear}">2026</span>
                    </h2>
                    <div class="flex items-center gap-2 mt-1 text-xs text-slate-400">
                        <span>Generated: <span class="text-slate-600" th:text="${report.generatedAt}">18 Apr 2026</span></span>
                        <span th:if="${report.fileSize != null}">&middot;</span>
                        <span th:if="${report.fileSize != null}" th:text="${report.fileSize}">145 KB</span>
                    </div>
                </div>
            </div>

            <div class="shrink-0">
                <a th:href="${report.downloadUrl}" target="_blank" class="btn btn-secondary btn-sm w-full sm:w-auto">
                    <i data-lucide="download" class="w-4 h-4"></i>
                    Download PDF
                </a>
            </div>
        </div>
    </div>
</main>
</body>
</html>
