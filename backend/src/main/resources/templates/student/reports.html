<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/base :: layout(~{::main})}">
<head>
    <title>Report Cards</title>
</head>
<body>
<main>
    <div class="mb-6">
        <h1 class="text-2xl font-semibold text-slate-900 tracking-tight">Official Report Cards</h1>
        <p class="text-xs sm:text-sm text-slate-500 mt-1">Download and view authenticated term performance reports generated by your school.</p>
    </div>

    <!-- Empty State -->
    <div th:if="${#lists.isEmpty(reports)}" 
         th:replace="~{fragments/empty-state :: empty-state('file-text', 'No report cards published', 'Official PDF report cards are published at the end of each academic term.')}">
    </div>

    <!-- Reports Cards List -->
    <div th:unless="${#lists.isEmpty(reports)}" class="space-y-4">
        <div th:each="report : ${reports}" 
             class="bg-white rounded-xl p-4 sm:p-5 border border-slate-200 shadow-sm flex flex-col sm:flex-row sm:items-center justify-between gap-4 hover:border-slate-200 transition">
            <div class="flex items-start gap-3.5">
                <div class="w-10 h-10 rounded-xl bg-red-50 text-red-600 flex items-center justify-center shrink-0 border border-red-100">
                    <i data-lucide="file-text" class="w-5 h-5"></i>
                </div>
                <div>
                    <h2 class="font-semibold text-base text-slate-900 leading-tight">
                        <span th:text="${report.termName}">Term 1</span> Report Card &middot; <span th:text="${report.academicYear}">2026</span>
                    </h2>
                    <div class="flex items-center gap-2 mt-1 text-xs text-slate-400">
                        <span>Generated: <span class="text-slate-600" th:text="${report.generatedAt}">18 Apr 2026</span></span>
                        <span th:if="${report.fileSize != null}">&middot;</span>
                        <span th:if="${report.fileSize != null}" th:text="${report.fileSize}">145 KB</span>
                    </div>
                </div>
            </div>

            <div class="shrink-0 flex items-center gap-2">
                <a th:href="${report.downloadUrl}" target="_blank"
                   class="inline-flex w-full sm:w-auto items-center justify-center gap-2 px-4 py-2 text-xs sm:text-sm font-semibold text-indigo-700 bg-indigo-50 border border-indigo-200 rounded-lg hover:bg-indigo-100 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition shadow-sm">
                    <i data-lucide="download" class="w-4 h-4"></i>
                    Download PDF
                </a>
            </div>
        </div>
    </div>
</main>
</body>
</html>
