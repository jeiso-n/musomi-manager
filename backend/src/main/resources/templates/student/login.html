<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/auth :: layout(~{::main})}">
<head>
    <title>Student Login</title>
</head>
<body>
<main>
    <div class="bg-white p-7 sm:p-8 rounded-xl shadow-md border border-slate-200">
        <!-- Logo & Header -->
        <div class="flex flex-col items-center mb-6 text-center">
            <div class="w-12 h-12 rounded-xl bg-indigo-600 flex items-center justify-center font-semibold text-white text-xl shadow-md mb-3">
                M
            </div>
            <h1 class="text-xl font-semibold text-slate-900 tracking-tight" th:text="${schoolName != null ? schoolName : 'Musomi Manager'}">Musomi Manager</h1>
            <p class="text-xs text-slate-500 font-medium mt-1">Student Learning Portal</p>
        </div>

        <!-- Error Notification -->
        <div th:if="${errorMessage}" class="mb-5 p-3.5 rounded-xl bg-red-50 border border-red-200 text-red-800 text-xs font-medium flex items-start gap-2.5">
            <i data-lucide="alert-circle" class="w-4 h-4 shrink-0 text-red-600 mt-0.5"></i>
            <span th:text="${errorMessage}">Invalid username or password.</span>
        </div>

        <!-- Login Form -->
        <form th:action="@{/login}" method="post" class="space-y-4" onsubmit="const schoolId = document.getElementById('schoolId').value; const username = document.getElementById('username'); if (!schoolId || !username.value.trim()) return false; username.value = schoolId + '::' + username.value.trim(); document.getElementById('login-btn').classList.add('opacity-75', 'pointer-events-none');">
            <div>
                <label for="schoolId" class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">School</label>
                <select id="schoolId" required class="block w-full rounded-lg border border-slate-200 shadow-sm px-3.5 py-2 text-sm text-slate-900 focus:border-indigo-600 focus:ring-2 focus:ring-indigo-500 transition">
                    <option value="" disabled selected>Select your school</option>
                    <option th:each="school : ${schools}" th:value="${school.id}" th:text="${school.name}">School name</option>
                </select>
            </div>
            <div>
                <label for="username" class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Admission No. or Username</label>
                <div class="relative">
                    <input type="text" id="username" name="username" required autocomplete="username" autofocus
                           placeholder="e.g. SMSS/2024/0142"
                           class="block w-full rounded-lg border border-slate-200 shadow-sm px-3.5 py-2 text-sm text-slate-900 focus:border-indigo-600 focus:ring-2 focus:ring-indigo-500 transition">
                </div>
                <p class="mt-1 text-[11px] text-slate-400">Use the student admission number provided by the school.</p>
            </div>

            <div>
                <label for="password" class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Password</label>
                <div class="relative">
                    <input type="password" id="password" name="password" required autocomplete="current-password"
                           placeholder="••••••••"
                           class="block w-full rounded-lg border border-slate-200 shadow-sm px-3.5 py-2 pr-10 text-sm text-slate-900 focus:border-indigo-600 focus:ring-2 focus:ring-indigo-500 transition">
                    <button type="button" 
                            class="absolute inset-y-0 right-0 flex items-center pr-3 text-slate-400 hover:text-slate-600 focus:outline-none" 
                            onclick="const p = document.getElementById('password'); const isPwd = p.type === 'password'; p.type = isPwd ? 'text' : 'password'; this.innerHTML = isPwd ? '<i data-lucide=\'eye-off\' class=\'w-4 h-4\'></i>' : '<i data-lucide=\'eye\' class=\'w-4 h-4\'></i>'; lucide.createIcons({root: this});" 
                            aria-label="Toggle password visibility">
                        <i data-lucide="eye" class="w-4 h-4"></i>
                    </button>
                </div>
            </div>

            <div class="pt-2">
                <button type="submit" id="login-btn" 
                        class="w-full flex justify-center items-center py-2.5 px-4 border border-transparent rounded-lg shadow-sm text-sm font-semibold text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition">
                    Sign In
                </button>
            </div>
        </form>

        <div class="mt-6 text-center border-t border-slate-100 pt-4">
            <p class="text-xs text-slate-400">
                Having trouble logging in? Contact the school administration for credentials.
            </p>
        </div>
    </div>
</main>
</body>
</html>
