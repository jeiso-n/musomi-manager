<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/base :: layout(~{::main})}">
<head>
    <title th:text="${subjectName + ' · Subject Detail'}">Subject Detail</title>
</head>
<body>
<main>
    <!-- Back Navigation -->
    <div class="mb-4">
        <a th:href="@{/student/marks}" 
           class="inline-flex items-center text-xs font-semibold text-indigo-600 hover:text-indigo-800 transition">
            <i data-lucide="arrow-left" class="w-4 h-4 mr-1"></i> Back to all marks
        </a>
    </div>

    <!-- Subject Header Banner -->
    <div class="bg-white rounded-2xl p-5 sm:p-6 border border-slate-200 shadow-sm mb-6">
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
                <span class="text-xs font-mono font-medium text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded"
                      th:text="${subjectCode != null ? subjectCode : 'SUB'}">MTH</span>
                <h1 class="text-2xl font-bold text-slate-900 tracking-tight mt-1.5" th:text="${subjectName}">Mathematics</h1>
                <p class="text-xs text-slate-500 mt-1" th:if="${teacherName != null}">
                    Teacher: <span class="font-medium text-slate-700" th:text="${teacherName}">Mr. Okello David</span>
                </p>
            </div>
            
            <div class="flex items-center gap-4 bg-slate-50 p-3 sm:p-4 rounded-xl border border-slate-100 self-start sm:self-auto">
                <div class="text-right">
                    <span class="text-xs font-medium text-slate-500 uppercase tracking-wider block">Average</span>
                    <span class="text-2xl font-bold font-mono text-slate-900 tabular-nums" th:text="${average != null ? average : '84.0'}">84.0</span>
                    <span class="text-xs text-slate-400 font-sans">%</span>
                </div>
                <div th:replace="~{fragments/grade-badge :: badge(${grade != null ? grade : 'A'})}"></div>
            </div>
        </div>
    </div>

    <!-- Assessment List -->
    <div class="mb-8">
        <h2 class="text-lg font-semibold text-slate-900 mb-3">All Assessments in this Subject</h2>

        <div th:if="${#lists.isEmpty(marks)}" 
             th:replace="~{fragments/empty-state :: empty('No assessments yet', 'There are no published assessments for this subject.')}">
        </div>

        <div th:unless="${#lists.isEmpty(marks)}" class="space-y-3">
            <div th:each="mark : ${marks}" 
                 class="bg-white rounded-xl p-4 sm:p-5 border border-slate-200 shadow-sm hover:border-indigo-200 transition">
                <div class="flex items-start justify-between gap-3">
                    <div class="min-w-0 flex-1">
                        <div class="flex items-center gap-2 flex-wrap mb-1">
                            <span class="font-semibold text-sm sm:text-base text-slate-900" th:text="${mark.title}">Algebra & Trigonometry Test</span>
                            <span class="inline-flex items-center px-2 py-0.5 rounded text-[10px] font-medium uppercase tracking-wider bg-slate-100 text-slate-600"
                                  th:text="${mark.type}">TEST</span>
                            <span th:if="${mark.topic != null}"
                                  class="inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-medium bg-indigo-50 text-indigo-700 border border-indigo-100"
                                  th:text="${mark.topic}">
                                Topic
                            </span>
                        </div>

                        <div class="flex items-center gap-2 text-xs text-slate-400 mt-1">
                            <i data-lucide="calendar" class="w-3.5 h-3.5"></i>
                            <span th:text="${mark.date}">15 Mar 2026</span>
                        </div>

                        <!-- Teacher feedback -->
                        <div th:if="${mark.feedback != null}" class="mt-2.5 p-2.5 rounded-lg bg-slate-50 border border-slate-100 text-xs text-slate-600">
                            <span class="font-medium text-slate-700">Teacher Feedback:</span>
                            <span class="italic" th:text="${mark.feedback}">Excellent problem-solving shown in section B.</span>
                        </div>
                    </div>

                    <div class="text-right shrink-0">
                        <div class="font-mono text-base sm:text-lg font-bold text-slate-900 tabular-nums">
                            <span th:text="${#numbers.formatDecimal(mark.score, 1, 1)}">88.0</span>
                            <span class="text-xs text-slate-400 font-normal">/</span>
                            <span class="text-xs text-slate-400 font-normal" th:text="${#numbers.formatDecimal(mark.maxScore, 1, 0)}">100</span>
                        </div>
                        <div class="mt-1">
                            <div th:replace="~{fragments/grade-badge :: badge(${mark.grade})}"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
