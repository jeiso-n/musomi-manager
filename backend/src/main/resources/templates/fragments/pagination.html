<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="pagination(page, totalPages, baseUrl)"
     th:if="${totalPages != null and totalPages > 1}"
     class="card flex items-center justify-between border-slate-200 px-4 py-3 sm:px-6 mt-6">
    <div class="flex flex-1 justify-between sm:hidden">
        <a th:href="@{${baseUrl}(page=${page - 1})}"
           th:classappend="${page <= 1 ? 'pointer-events-none opacity-50' : ''}"
           class="btn btn-secondary btn-sm">Previous</a>
        <a th:href="@{${baseUrl}(page=${page + 1})}"
           th:classappend="${page >= totalPages ? 'pointer-events-none opacity-50' : ''}"
           class="btn btn-secondary btn-sm">Next</a>
    </div>
    <div class="hidden sm:flex sm:flex-1 sm:items-center sm:justify-between">
        <div>
            <p class="text-sm text-slate-600">
                Page <span class="font-medium font-mono" th:text="${page}">1</span> of <span class="font-medium font-mono" th:text="${totalPages}">5</span>
            </p>
        </div>
        <div>
            <nav class="isolate inline-flex -space-x-px rounded-lg shadow-sm" aria-label="Pagination">
                <a th:href="@{${baseUrl}(page=${page - 1})}"
                   th:classappend="${page <= 1 ? 'pointer-events-none opacity-40' : ''}"
                   class="relative inline-flex items-center rounded-l-lg px-2.5 py-2 text-slate-500 ring-1 ring-inset ring-slate-200 hover:bg-slate-50 focus:z-20 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500">
                    <span class="sr-only">Previous</span>
                    <i data-lucide="chevron-left" class="h-5 w-5"></i>
                </a>
                <span class="relative inline-flex items-center px-4 py-2 text-sm font-semibold text-blue-700 ring-1 ring-inset ring-slate-200 bg-blue-50" th:text="${page}">1</span>
                <a th:href="@{${baseUrl}(page=${page + 1})}"
                   th:classappend="${page >= totalPages ? 'pointer-events-none opacity-40' : ''}"
                   class="relative inline-flex items-center rounded-r-lg px-2.5 py-2 text-slate-500 ring-1 ring-inset ring-slate-200 hover:bg-slate-50 focus:z-20 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500">
                    <span class="sr-only">Next</span>
                    <i data-lucide="chevron-right" class="h-5 w-5"></i>
                </a>
            </nav>
        </div>
    </div>
</div>
</body>
</html>
