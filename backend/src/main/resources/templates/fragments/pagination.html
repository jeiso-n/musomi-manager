<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="pagination(page, totalPages, baseUrl)" 
     th:if="${totalPages != null and totalPages > 1}" 
     class="flex items-center justify-between border-t border-slate-200 px-4 py-3 sm:px-6 mt-6 bg-white rounded-xl shadow-sm">
    <div class="flex flex-1 justify-between sm:hidden">
        <a th:href="@{${baseUrl}(page=${page - 1})}" 
           th:classappend="${page <= 1 ? 'pointer-events-none opacity-50 bg-slate-50' : 'bg-white hover:bg-slate-50'}"
           class="relative inline-flex items-center rounded-lg border border-slate-200 px-4 py-2 text-sm font-medium text-slate-700">Previous</a>
        <a th:href="@{${baseUrl}(page=${page + 1})}" 
           th:classappend="${page >= totalPages ? 'pointer-events-none opacity-50 bg-slate-50' : 'bg-white hover:bg-slate-50'}"
           class="relative ml-3 inline-flex items-center rounded-lg border border-slate-200 px-4 py-2 text-sm font-medium text-slate-700">Next</a>
    </div>
    <div class="hidden sm:flex sm:flex-1 sm:items-center sm:justify-between">
        <div>
            <p class="text-sm text-slate-700">
                Page <span class="font-medium font-mono" th:text="${page}">1</span> of <span class="font-medium font-mono" th:text="${totalPages}">5</span>
            </p>
        </div>
        <div>
            <nav class="isolate inline-flex -space-x-px rounded-md shadow-sm" aria-label="Pagination">
                <a th:href="@{${baseUrl}(page=${page - 1})}" 
                   th:classappend="${page <= 1 ? 'pointer-events-none opacity-40' : 'hover:bg-slate-50'}"
                   class="relative inline-flex items-center rounded-l-md px-2 py-2 text-slate-400 ring-1 ring-inset ring-slate-300 focus:z-20 focus:outline-offset-0">
                    <span class="sr-only">Previous</span>
                    <i data-lucide="chevron-left" class="h-5 w-5"></i>
                </a>
                <span class="relative inline-flex items-center px-4 py-2 text-sm font-semibold text-indigo-600 ring-1 ring-inset ring-slate-300 bg-indigo-50" th:text="${page}">1</span>
                <a th:href="@{${baseUrl}(page=${page + 1})}" 
                   th:classappend="${page >= totalPages ? 'pointer-events-none opacity-40' : 'hover:bg-slate-50'}"
                   class="relative inline-flex items-center rounded-r-md px-2 py-2 text-slate-400 ring-1 ring-inset ring-slate-300 focus:z-20 focus:outline-offset-0">
                    <span class="sr-only">Next</span>
                    <i data-lucide="chevron-right" class="h-5 w-5"></i>
                </a>
            </nav>
        </div>
    </div>
</div>
</body>
</html>
