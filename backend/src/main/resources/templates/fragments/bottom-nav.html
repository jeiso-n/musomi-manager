<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<nav th:fragment="bottom-nav" class="md:hidden fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur-md border-t border-slate-200 h-16 z-40 pb-safe shadow-[0_-8px_24px_-18px_rgba(15,23,42,0.45)]" aria-label="Mobile Navigation">
    <div class="max-w-md mx-auto h-full grid grid-cols-5 items-center px-1">
        <a th:href="@{/student/dashboard}" class="bottom-link"
           th:classappend="${currentPage == 'dashboard' ? 'bottom-link-active font-semibold' : ''}">
            <i data-lucide="home" class="w-5 h-5" th:classappend="${currentPage == 'dashboard' ? 'stroke-[2.5]' : 'stroke-2'}"></i>
            <span class="text-[11px] leading-none">Home</span>
        </a>

        <a th:href="@{/student/marks}" class="bottom-link"
           th:classappend="${currentPage == 'marks' ? 'bottom-link-active font-semibold' : ''}">
            <i data-lucide="clipboard-list" class="w-5 h-5" th:classappend="${currentPage == 'marks' ? 'stroke-[2.5]' : 'stroke-2'}"></i>
            <span class="text-[11px] leading-none">Marks</span>
        </a>

        <a th:href="@{/student/results}" class="bottom-link"
           th:classappend="${currentPage == 'results' ? 'bottom-link-active font-semibold' : ''}">
            <i data-lucide="bar-chart-2" class="w-5 h-5" th:classappend="${currentPage == 'results' ? 'stroke-[2.5]' : 'stroke-2'}"></i>
            <span class="text-[11px] leading-none">Results</span>
        </a>

        <a th:href="@{/student/reports}" class="bottom-link"
           th:classappend="${currentPage == 'reports' ? 'bottom-link-active font-semibold' : ''}">
            <i data-lucide="file-text" class="w-5 h-5" th:classappend="${currentPage == 'reports' ? 'stroke-[2.5]' : 'stroke-2'}"></i>
            <span class="text-[11px] leading-none">Reports</span>
        </a>

        <a th:href="@{/student/profile}" class="bottom-link"
           th:classappend="${currentPage == 'profile' ? 'bottom-link-active font-semibold' : ''}">
            <i data-lucide="user" class="w-5 h-5" th:classappend="${currentPage == 'profile' ? 'stroke-[2.5]' : 'stroke-2'}"></i>
            <span class="text-[11px] leading-none">Me</span>
        </a>
    </div>
</nav>
</body>
</html>
