<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!-- Three parameter version -->
<div th:fragment="empty-state(icon, title, message)" class="flex flex-col items-center justify-center p-8 text-center bg-white rounded-xl border border-slate-200 shadow-sm">
    <div class="w-12 h-12 rounded-full bg-slate-100 flex items-center justify-center mb-3">
        <i th:data-lucide="${icon != null ? icon : 'inbox'}" class="w-6 h-6 text-slate-400"></i>
    </div>
    <h3 class="text-base font-semibold text-slate-900 mb-1" th:text="${title}">No records found</h3>
    <p class="text-sm text-slate-500 max-w-sm mx-auto" th:text="${message}">There are no items to display at this time.</p>
</div>

<!-- Two parameter version from WEB.md -->
<div th:fragment="empty(title, message)" class="flex flex-col items-center justify-center py-12 px-4 text-center bg-white rounded-xl border border-slate-200 shadow-sm">
    <div class="w-12 h-12 rounded-full bg-slate-100 flex items-center justify-center mb-3">
        <i data-lucide="inbox" class="w-6 h-6 text-slate-400"></i>
    </div>
    <h3 class="text-base font-semibold text-slate-900 mb-1" th:text="${title}">No data yet</h3>
    <p class="text-sm text-slate-500 max-w-sm mx-auto" th:text="${message}">Your information will appear here once published.</p>
</div>

</body>
</html>
