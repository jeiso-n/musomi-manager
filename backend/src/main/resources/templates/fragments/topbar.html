<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<header th:fragment="topbar" class="sticky top-0 z-40 bg-white/90 backdrop-blur-md border-b border-slate-200/80">
    <div class="max-w-3xl mx-auto px-4 h-16 flex items-center justify-between gap-3">
        <!-- Brand / School Identity -->
        <a th:href="@{/student/dashboard}" class="flex items-center gap-2.5 group min-w-0">
            <span class="brand-mark">M</span>
            <span class="flex flex-col min-w-0">
                <span class="font-semibold text-[15px] tracking-tight leading-none text-slate-900 truncate group-hover:text-blue-700 transition-colors"
                      th:text="${schoolName != null ? schoolName : 'Musomi Manager'}">Musomi Manager</span>
                <span class="text-[11px] font-medium leading-none mt-1 text-blue-600/80">Student Portal</span>
            </span>
        </a>

        <!-- Desktop Nav -->
        <nav class="hidden md:flex items-center gap-1" aria-label="Student Navigation">
            <a th:href="@{/student/dashboard}" class="nav-link"
               th:classappend="${currentPage == 'dashboard' ? 'nav-link-active' : ''}">Home</a>
            <a th:href="@{/student/marks}" class="nav-link"
               th:classappend="${currentPage == 'marks' ? 'nav-link-active' : ''}">Marks</a>
            <a th:href="@{/student/results}" class="nav-link"
               th:classappend="${currentPage == 'results' ? 'nav-link-active' : ''}">Results</a>
            <a th:href="@{/student/reports}" class="nav-link"
               th:classappend="${currentPage == 'reports' ? 'nav-link-active' : ''}">Reports</a>

            <div class="w-px h-5 bg-slate-200 mx-1.5"></div>

            <a th:href="@{/student/profile}" class="icon-btn"
               th:classappend="${currentPage == 'profile' ? 'bg-blue-50 text-blue-700' : ''}"
               title="My Profile" aria-label="My Profile">
                <i data-lucide="user-circle" class="w-5 h-5"></i>
            </a>

            <form th:action="@{/logout}" method="post" class="inline">
                <button type="submit" class="icon-btn hover:text-red-600" title="Sign out" aria-label="Sign out">
                    <i data-lucide="log-out" class="w-5 h-5"></i>
                </button>
            </form>
        </nav>

        <!-- Mobile header quick actions -->
        <div class="flex items-center gap-1 md:hidden">
            <a th:href="@{/student/profile}" class="icon-btn" aria-label="Profile">
                <i data-lucide="user" class="w-5 h-5"></i>
            </a>
            <form th:action="@{/logout}" method="post" class="inline">
                <button type="submit" class="icon-btn hover:text-red-600" aria-label="Sign out">
                    <i data-lucide="log-out" class="w-5 h-5"></i>
                </button>
            </form>
        </div>
    </div>
</header>
</body>
</html>
