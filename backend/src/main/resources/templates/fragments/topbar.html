<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<header th:fragment="topbar" class="bg-indigo-900 text-white shadow-sm sticky top-0 z-40">
    <div class="max-w-3xl mx-auto px-4 h-14 flex items-center justify-between">
        <!-- Brand / School Identity -->
        <a th:href="@{/student/dashboard}" class="flex items-center gap-2.5 group">
            <div class="w-8 h-8 rounded-lg bg-indigo-700/60 border border-indigo-500/30 flex items-center justify-center font-bold text-white text-sm">
                M
            </div>
            <div class="flex flex-col">
                <span class="font-semibold text-base tracking-tight leading-none text-white group-hover:text-indigo-100 transition" th:text="${schoolName != null ? schoolName : 'Musomi Manager'}">Musomi Manager</span>
                <span class="text-[11px] text-indigo-200/80 font-medium leading-none mt-1">Student Portal</span>
            </div>
        </a>
        
        <!-- Desktop Nav -->
        <nav class="hidden md:flex items-center gap-1.5" aria-label="Student Navigation">
            <a th:href="@{/student/dashboard}" 
               class="px-3 py-1.5 rounded-lg text-sm font-medium transition-colors"
               th:classappend="${currentPage == 'dashboard' ? 'bg-indigo-800 text-white' : 'text-indigo-200 hover:text-white hover:bg-indigo-800/50'}">
               Home
            </a>
            <a th:href="@{/student/marks}" 
               class="px-3 py-1.5 rounded-lg text-sm font-medium transition-colors"
               th:classappend="${currentPage == 'marks' ? 'bg-indigo-800 text-white' : 'text-indigo-200 hover:text-white hover:bg-indigo-800/50'}">
               Marks
            </a>
            <a th:href="@{/student/results}" 
               class="px-3 py-1.5 rounded-lg text-sm font-medium transition-colors"
               th:classappend="${currentPage == 'results' ? 'bg-indigo-800 text-white' : 'text-indigo-200 hover:text-white hover:bg-indigo-800/50'}">
               Results
            </a>
            <a th:href="@{/student/reports}" 
               class="px-3 py-1.5 rounded-lg text-sm font-medium transition-colors"
               th:classappend="${currentPage == 'reports' ? 'bg-indigo-800 text-white' : 'text-indigo-200 hover:text-white hover:bg-indigo-800/50'}">
               Reports
            </a>
            
            <div class="w-px h-5 bg-indigo-700/50 mx-1.5"></div>
            
            <a th:href="@{/student/profile}" 
               class="p-1.5 rounded-lg text-indigo-200 hover:text-white hover:bg-indigo-800/50 transition-colors"
               title="My Profile"
               th:classappend="${currentPage == 'profile' ? 'bg-indigo-800 text-white' : ''}">
                <i data-lucide="user-circle" class="w-5 h-5"></i>
                <span class="sr-only">Profile</span>
            </a>
            
            <form th:action="@{/logout}" method="post" class="inline">
                <button type="submit" 
                        class="p-1.5 rounded-lg text-indigo-200 hover:text-red-200 hover:bg-red-900/30 transition-colors" 
                        title="Sign out"
                        aria-label="Sign out">
                    <i data-lucide="log-out" class="w-5 h-5"></i>
                </button>
            </form>
        </nav>

        <!-- Mobile header quick actions -->
        <div class="flex items-center gap-1 md:hidden">
            <a th:href="@{/student/profile}" class="p-2 text-indigo-200 hover:text-white" aria-label="Profile">
                <i data-lucide="user" class="w-5 h-5"></i>
            </a>
            <form th:action="@{/logout}" method="post" class="inline">
                <button type="submit" class="p-2 text-indigo-200 hover:text-red-200" aria-label="Sign out">
                    <i data-lucide="log-out" class="w-5 h-5"></i>
                </button>
            </form>
        </div>
    </div>
</header>
</body>
</html>
