<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!-- Grade Badge Component conforming to DESIGN_SYSTEM.md §3 -->
<span th:fragment="badge(grade)" 
      class="inline-flex items-center justify-center font-mono font-semibold px-2 py-0.5 rounded-full text-xs uppercase tracking-wide border shadow-sm"
      th:classappend="${
          grade == 'A' ? 'bg-emerald-50 text-emerald-700 border-emerald-200' :
          grade == 'B' ? 'bg-blue-50 text-blue-700 border-blue-200' :
          grade == 'C' ? 'bg-amber-50 text-amber-700 border-amber-200' :
          grade == 'D' ? 'bg-orange-50 text-orange-700 border-orange-200' :
          grade == 'E' ? 'bg-red-50 text-red-700 border-red-200' :
          grade == 'F' ? 'bg-red-100 text-red-800 border-red-300' :
          'bg-slate-100 text-slate-700 border-slate-200'
      }"
      th:text="${grade != null ? grade : '-'}">
    A
</span>
</body>
</html>
