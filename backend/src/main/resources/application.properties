# Application
spring.application.name=Musomi Manager

# Local development database. Production values are mandatory in application-prod.properties.
spring.datasource.url=jdbc:postgresql://localhost:5432/musomi_manager
spring.datasource.username=musomi
spring.datasource.password=dev_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
# Local development includes sample seed data; production profile uses only db/migration.
spring.flyway.locations=classpath:db/migration,classpath:db/dev-seed

# Generated report PDFs (keep this directory on persistent storage)
musomi.reports.storage-dir=data/reports

# Server
server.port=8080

# Application logging (avoid SQL and request data in normal logs)
logging.level.com.musomi=INFO

# Local-development JWT fallback. The production profile requires JWT_SECRET explicitly.
jwt.secret=${JWT_SECRET:musomi-manager-dev-secret-change-in-production-min-32-chars-long}
jwt.expiration-ms=28800000
