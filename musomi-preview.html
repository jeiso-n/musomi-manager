<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Musomi Manager · Student Portal (preview)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <script>tailwind.config = {theme: {extend: {fontFamily: {sans: ['Inter', 'system-ui', 'sans-serif'], mono: ['JetBrains Mono', 'monospace']}}}}</script>
  <style>
    :root {
      color-scheme: light;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px)
    }

    body {
      background: #F8FAFC
    }

    @media (prefers-reduced-motion:reduce) {
      * {
        transition: none !important
      }
    }

    /* Home carousel */
    .car {
      background: linear-gradient(135deg, #2563EB, #1E40AF)
    }

    .car-track {
      display: grid
    }

    .car-slide {
      grid-area: 1/1;
      opacity: 0;
      visibility: hidden;
      transform: translateX(28px);
      padding: 1.5rem 3.25rem 3.5rem;
      transition: opacity .55s ease, transform .55s ease, visibility 0s .55s
    }

    .car-slide.prev {
      transform: translateX(-28px)
    }

    .car-slide.active {
      opacity: 1;
      visibility: visible;
      transform: none;
      transition: opacity .55s ease, transform .55s ease, visibility 0s
    }

    .car-slide.active .rise {
      animation: rise .6s ease both
    }

    .car-slide.active .rise:nth-child(2) {
      animation-delay: .08s
    }

    .car-slide.active .rise:nth-child(3) {
      animation-delay: .16s
    }

    .car-slide.active .rise:nth-child(4) {
      animation-delay: .24s
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(8px)
      }

      to {
        opacity: 1;
        transform: none
      }
    }

    .car-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      height: 2.25rem;
      width: 2.25rem;
      border-radius: 9999px;
      background: rgba(255, 255, 255, .22);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background .2s
    }

    .car-btn:hover {
      background: rgba(255, 255, 255, .38)
    }

    .car-btn:focus-visible,
    .dot:focus-visible {
      outline: 2px solid #fff;
      outline-offset: 2px
    }

    .dots {
      position: absolute;
      left: 0;
      right: 0;
      bottom: .75rem;
      display: flex;
      justify-content: center;
      gap: .5rem
    }

    .dot {
      padding: .5rem 0
    }

    .dot b {
      display: block;
      position: relative;
      overflow: hidden;
      height: 3px;
      width: 2.5rem;
      border-radius: 2px;
      background: rgba(255, 255, 255, .35)
    }

    .dot i {
      position: absolute;
      inset: 0 auto 0 0;
      width: 0;
      background: #fff
    }

    .dot.on i {
      animation: fill 7s linear forwards
    }

    .car.paused .dot.on i {
      animation-play-state: paused
    }

    @keyframes fill {
      from {
        width: 0
      }

      to {
        width: 100%
      }
    }

    @media (prefers-reduced-motion:reduce) {
      .dot.on i {
        animation: none;
        width: 100%
      }

      .car-slide.active .rise {
        animation: none
      }
    }

    .view {
      animation: rise .35s ease both
    }

    @media print {
      .noprint {
        display: none !important
      }
    }
  </style>
</head>

<body class="font-sans text-slate-900 antialiased pb-20 md:pb-0">

    const MARKS = [

      {s: 3, sub: 'Biology', t: 'Cell Quiz', type: 'QUIZ', d: '2026-03-22', sc: 91, mx: 100, g: 'A'},

    /* Grading helpers (A>=90, B>=70, C>=60, D>=50, E>=40, else F) */
    const gradeOf = a => a >= 90 ? 'A' : a >= 70 ? 'B' : a >= 60 ? 'C' : a >= 50 ? 'D' : a >= 40 ? 'E' : 'F';
    const remarkOf = g => ({A: 'Excellent', B: 'Good', C: 'Fair', D: 'Needs improvement', E: 'Weak', F: 'Very weak'})[g];
    const avgOf = l => Math.round(l.reduce((s, x) => s + x.a, 0) / l.length * 10) / 10;
    const AVG = avgOf(RES).toFixed(1);

    const REPORTS = [
      {
        t: 'Term 1', y: 2026, cls: 'S3 Blue', at: '2026-04-20', pos: 12, of: 42, subs: RES.map(r => ({n: r.n, a: r.a, g: r.g})),
        rem: 'Sarah is a diligent learner and shows real strength in Biology and Mathematics. She should give more attention to History essays and keep practising English comprehension to lift her overall position next term.'
      },
      {
        t: 'Term 3', y: 2025, cls: 'S2 Blue', at: '2025-12-05', pos: 15, of: 41, subs: [{n: 'Mathematics', a: 74, g: 'B'}, {n: 'English', a: 63, g: 'C'}, {n: 'Biology', a: 85, g: 'B'}, {n: 'History', a: 58, g: 'D'}],
        rem: 'A steady and well-behaved student. Good progress in Biology. More effort is needed in History and English to reach her full potential.'
      }];

    /* Home carousel data */
    const EV = {'2026-11-19': 'Sports Day', '2026-11-23': 'End-of-term exams begin', '2026-11-27': "Parents' meeting", '2026-12-04': 'Term 3 closes'};
    const ANN = [

    const TT = {

      2: [['08:00', '09:20', 'English', 'Room 7'], ['09:30', '10:50', 'Biology', 'Lab 1'], ['11:20', '12:40', 'Mathematics', 'Room 4'], ['14:00', '15:20', 'History', 'Room 2']],
      3: [['08:00', '09:20', 'Biology', 'Lab 1'], ['09:30', '10:50', 'Mathematics', 'Room 4'], ['11:20', '12:40', 'History', 'Room 2'], ['14:00', '15:20', 'English', 'Room 7']],
      4: [['08:00', '09:20', 'History', 'Room 2'], ['09:30', '10:50', 'English', 'Room 7'], ['11:20', '12:40', 'Biology', 'Lab 1'], ['14:00', '15:20', 'Mathematics', 'Room 4']],
      5: [['08:00', '09:20', 'Mathematics', 'Room 4'], ['09:30', '10:50', 'Biology', 'Lab 1'], ['11:20', '12:40', 'English', 'Room 7'], ['14:00', '15:20', 'History', 'Room 2']]
    };

    const GC = {A: 'bg-emerald-50 text-emerald-700', B: 'bg-blue-50 text-blue-700', C: 'bg-amber-50 text-amber-700', D: 'bg-orange-50 text-orange-700', E: 'bg-red-50 text-red-700', F: 'bg-red-100 text-red-800'};
    const badge = g => `<span class="inline-block px-2.5 py-0.5 rounded-full text-xs font-semibold font-mono ${GC[g]}">${g}</span>`;
    const BTN = 'px-5 py-2.5 rounded-lg bg-blue-600 text-white font-semibold text-sm hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2';
    const INP = 'w-full px-3 py-2.5 rounded-lg border border-slate-200 text-sm focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 focus:outline-none';
    const NAV = [['dashboard', 'Home', 'M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z'], ['marks', 'Marks', 'M9 5h10M9 12h10M9 19h10M4 5h.01M4 12h.01M4 19h.01'], ['results', 'Results', 'M4 20V10M10 20V4M16 20v-7M22 20H2'], ['reports', 'Reports', 'M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8zM14 3v5h5'], ['profile', 'Me', 'M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z']];
    const ico = (d, c = 'w-5 h-5') => `<svg class="${c}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${d}"/></svg>`;
    const logo = `<svg class="h-7 w-7" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#2563EB"/><path d="M8 22V10l8 8 8-8v12" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
    const empty = (t, m) => `<div class="text-center py-12">${ico('M22 12h-6l-2 3h-4l-2-3H2M5.5 5h13L22 12v6a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-6z', 'w-12 h-12 text-slate-300 mx-auto mb-3')}<h3 class="font-semibold text-slate-700">${t}</h3><p class="text-sm text-slate-500 mt-1">${m}</p></div>`;
    const markCard = m => `<a href="#/subject/${m.s}" class="block bg-white rounded-xl p-4 shadow-sm hover:shadow-md transition focus:outline-none focus:ring-2 focus:ring-blue-500"><div class="flex justify-between items-start gap-3"><div><div class="font-medium">${m.sub}</div><div class="text-sm text-slate-500">${m.t} · ${m.d}</div></div><div class="text-right space-y-1"><div class="font-mono text-lg font-semibold">${m.sc}/${m.mx}</div>${badge(m.g)}</div></div></a>`;
    const fmtD = iso => new Date(iso + 'T00:00:00').toLocaleDateString('en-GB', {day: 'numeric', month: 'short'});

    /* ---------- Home carousel slides ---------- */
    function calSlide() {
      const n = new Date(), y = n.getFullYear(), m = n.getMonth(), off = (new Date(y, m, 1).getDay() + 6) % 7, days = new Date(y, m + 1, 0).getDate();
      const iso = d => `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`, todayIso = iso(n.getDate());
      let cells = '<span></span>'.repeat(off);
      for (let d = 1; d <= days; d++) {
        const k = iso(d), t = k === todayIso, e = EV[k];
        cells += `<span ${e ? `title="${e}"` : ''} class="h-8 w-8 mx-auto flex items-center justify-center rounded-full text-xs ${t ? 'bg-white text-blue-700 font-semibold' : e ? 'ring-1 ring-amber-300 bg-white/15 font-medium' : 'text-blue-50'}">${d}</span>`
      }
      const up = Object.entries(EV).filter(([k]) => k >= todayIso).sort().slice(0, 3);
      return `<p class="rise text-xs uppercase tracking-wide text-blue-100 font-semibold mb-1">Calendar</p>
 <h2 class="rise text-xl font-semibold mb-3">${n.toLocaleDateString('en-GB', {month: 'long', year: 'numeric'})}</h2>
 <div class="rise flex flex-col sm:flex-row gap-5 sm:gap-8">
  <div class="grid grid-cols-7 gap-y-1 w-full sm:w-64 shrink-0 text-center"><span class="text-[11px] text-blue-100 mb-1">M</span><span class="text-[11px] text-blue-100">T</span><span class="text-[11px] text-blue-100">W</span><span class="text-[11px] text-blue-100">T</span><span class="text-[11px] text-blue-100">F</span><span class="text-[11px] text-blue-100">S</span><span class="text-[11px] text-blue-100">S</span>${cells}</div>
  <ul class="space-y-2 text-sm self-center">${up.length ? up.map(([k, v]) => `<li class="flex items-start gap-3"><span class="font-mono text-xs bg-white/20 rounded px-2 py-1 whitespace-nowrap">${fmtD(k)}</span><span>${v}</span></li>`).join('') : '<li class="text-blue-50">No upcoming events.</li>'}</ul></div>`;
    }
    function ttSlide() {
      const n = new Date(); let d = n.getDay(), label = "Today's timetable";
      if (d === 0 || d === 6) {d = 1; label = "Monday's timetable"}
      const now = n.getHours() * 60 + n.getMinutes(), mins = t => {const [a, b] = t.split(':'); return +a * 60 + +b};
      return `<p class="rise text-xs uppercase tracking-wide text-blue-100 font-semibold mb-1">Timetable</p>
 <h2 class="rise text-xl font-semibold mb-3">${label}</h2>
 <ul class="rise grid sm:grid-cols-2 gap-2">${TT[d].map(([a, b, s, r]) => {
        const cur = now >= mins(a) && now < mins(b);
        return `<li class="flex items-center justify-between gap-3 rounded-lg px-3 py-2 ${cur ? 'bg-white text-blue-800' : 'bg-white/15'}"><div><div class="font-medium text-sm">${s}</div><div class="text-xs ${cur ? 'text-blue-700' : 'text-blue-100'}">${r}${cur ? ' · Now' : ''}</div></div><span class="font-mono text-xs whitespace-nowrap">${a}–${b}</span></li>`
      }).join('')}</ul>`;
    }
    const SLIDES = [
      () => {
        const h = new Date().getHours(), g = h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening';
        return `<p class="rise text-xs uppercase tracking-wide text-blue-100 font-semibold mb-1">Welcome</p>
  <h2 class="rise text-2xl font-semibold mb-2">${g} ${S.first}</h2>
  <p class="rise text-blue-50 text-sm leading-relaxed max-w-xl">Your all-in-one platform for checking your marks, results and report cards, and staying up to date with announcements from ${S.school}. Explore the features and make the most of your learning experience.</p>
  <p class="rise text-xs text-blue-100 mt-3">${S.cls} ${S.stream} · Term 1, 2026</p>`
      },
      calSlide,
      () => {
        const l = MARKS[0]; return `<p class="rise text-xs uppercase tracking-wide text-blue-100 font-semibold mb-1">Student update</p>
  <h2 class="rise text-xl font-semibold mb-3">How you are doing</h2>
  <div class="rise grid grid-cols-3 gap-3 text-center max-w-md"><div class="bg-white/15 rounded-lg py-3"><div class="font-mono text-2xl font-semibold">${AVG}</div><div class="text-xs text-blue-100">Average %</div></div><div class="bg-white/15 rounded-lg py-3"><div class="font-mono text-2xl font-semibold">${gradeOf(+AVG)}</div><div class="text-xs text-blue-100">Grade</div></div><div class="bg-white/15 rounded-lg py-3"><div class="font-mono text-2xl font-semibold">12/42</div><div class="text-xs text-blue-100">Position</div></div></div>
  <p class="rise text-sm text-blue-50 mt-3">Latest: ${l.sub}, ${l.t} (${l.sc}/${l.mx}). <a href="#/results" class="underline font-medium hover:text-white">See full results</a></p>`
      },
      () => `<p class="rise text-xs uppercase tracking-wide text-blue-100 font-semibold mb-1">Announcements</p>

  <ul class="rise space-y-3">${ANN.map(a => `<li class="flex items-start gap-3"><span class="font-mono text-xs bg-white/20 rounded px-2 py-1 whitespace-nowrap">${fmtD(a.d)}</span><div><div class="font-medium text-sm">${a.t}</div><div class="text-xs text-blue-100">${a.m}</div></div></li>`).join('')}</ul>`,

    const carousel = () => `<section id="car" class="car relative rounded-2xl overflow-hidden text-white shadow-sm mb-6" aria-roledescription="carousel" aria-label="Home highlights" tabindex="-1">

<button class="car-btn" style="right:.75rem" data-dir="1" aria-label="Next slide">${ico('M9 18l6-6-6-6', 'w-4 h-4')}</button>
<div class="dots" role="tablist" aria-label="Choose slide">${SNAME.map((n, i) => `<button class="dot" role="tab" aria-label="${n}" data-i="${i}"><b><i></i></b></button>`).join('')}</div></section>`;

    function initCarousel() {
      const c = document.getElementById('car'); if (!c) return;
      const sl = [...c.querySelectorAll('.car-slide')], dots = [...c.querySelectorAll('.dot')]; let i = 0;
      const go = n => {
        i = (n + sl.length) % sl.length;
        sl.forEach((s, k) => {s.classList.toggle('active', k === i); s.classList.toggle('prev', k < i); s.setAttribute('aria-hidden', k !== i)});
        dots.forEach((d, k) => {d.classList.remove('on'); d.setAttribute('aria-selected', k === i); if (k === i) {void d.offsetWidth; d.classList.add('on')} })
      };
      c.querySelectorAll('.car-btn').forEach(b => b.onclick = () => go(i + +b.dataset.dir));
      dots.forEach(d => {d.onclick = () => go(+d.dataset.i); d.querySelector('i').addEventListener('animationend', () => go(i + 1))});
      const pause = v => c.classList.toggle('paused', v);
      c.addEventListener('mouseenter', () => pause(true)); c.addEventListener('mouseleave', () => pause(false));

    /* ---------- Report card PDF ---------- */

      d.setFont('helvetica', 'normal'); d.setFontSize(11); d.text(`Student Report Card  |  ${r.t} ${r.y}`, 14, 25);
      let y = 46; d.setTextColor(15, 23, 42); d.setFont('helvetica', 'bold'); d.setFontSize(12); d.text('Student details', 14, y); y += 3; d.setDrawColor(226, 232, 240); d.line(14, y, W - 14, y); y += 7;
      const det = [['Full name', S.fullName], ['Class', r.cls], ['Admission no.', S.adm], ['Gender', S.gender], ['Date of birth', S.dob], ['Guardian', S.guardian], ['Guardian phone', S.phone], ['Report generated', r.at]];
      d.setFontSize(10);
      det.forEach(([k, v], n) => {const x = n % 2 ? W / 2 + 4 : 14; if (n && !(n % 2)) y += 8; d.setFont('helvetica', 'normal'); d.setTextColor(100, 116, 139); d.text(k, x, y); d.setFont('helvetica', 'bold'); d.setTextColor(15, 23, 42); d.text(String(v), x + 34, y)});
      y += 14;
      [['Average', avg.toFixed(1) + '%'], ['Grade', g], ['Position', `${r.pos} of ${r.of}`]].forEach(([k, v], n) => {const x = 14 + n * 62; d.setFillColor(239, 246, 255); d.roundedRect(x, y, 58, 20, 2, 2, 'F'); d.setTextColor(30, 64, 175); d.setFont('helvetica', 'bold'); d.setFontSize(15); d.text(v, x + 29, y + 10, {align: 'center'}); d.setFont('helvetica', 'normal'); d.setFontSize(9); d.setTextColor(100, 116, 139); d.text(k, x + 29, y + 16, {align: 'center'})});
      y += 32; d.setTextColor(15, 23, 42); d.setFont('helvetica', 'bold'); d.setFontSize(12); d.text('Subject results', 14, y); y += 4;
      d.setFillColor(241, 245, 249); d.rect(14, y, W - 28, 9, 'F'); d.setFontSize(9); d.setTextColor(71, 85, 105); d.text('SUBJECT', 17, y + 6); d.text('AVERAGE', 100, y + 6); d.text('GRADE', 130, y + 6); d.text('REMARK', 152, y + 6); y += 9;
      r.subs.forEach(s => {d.setFont('helvetica', 'normal'); d.setFontSize(10); d.setTextColor(15, 23, 42); d.text(s.n, 17, y + 6.5); d.text(s.a.toFixed(1), 100, y + 6.5); d.setFont('helvetica', 'bold'); d.text(s.g, 130, y + 6.5); d.setFont('helvetica', 'normal'); d.text(remarkOf(s.g), 152, y + 6.5); y += 10; d.setDrawColor(226, 232, 240); d.line(14, y, W - 14, y)});
      y += 10; d.setFont('helvetica', 'bold'); d.setFontSize(12); d.setTextColor(15, 23, 42); d.text("Class teacher's remarks", 14, y); y += 6;
      d.setFont('helvetica', 'normal'); d.setFontSize(10); d.setTextColor(51, 65, 85); const ln = d.splitTextToSize(r.rem, W - 28); d.text(ln, 14, y); y += ln.length * 5 + 16;
      d.setDrawColor(148, 163, 184); d.line(14, y, 74, y); d.line(W - 74, y, W - 14, y); d.setFontSize(8); d.setTextColor(100, 116, 139); d.text('Class teacher', 14, y + 4); d.text('Head teacher', W - 74, y + 4);
      d.setFontSize(8); d.text('Computer-generated report. Generated by Musomi Manager.', W / 2, 287, {align: 'center'});
      d.save(`Report_${S.adm.replace('/', '-')}_${r.t.replace(' ', '')}_${r.y}.pdf`);

    }

    /* ---------- Pages ---------- */
    const dt = (k, v, mono) => `<div><dt class="text-slate-500">${k}</dt><dd class="${mono ? 'font-mono ' : ''}font-medium">${v}</dd></div>`;

<div class="flex items-center justify-between mb-3"><h2 class="text-lg font-semibold">Recent marks</h2><a href="#/marks" class="text-sm font-medium text-blue-600 hover:text-blue-700">View all</a></div>
<div class="space-y-2">${MARKS.slice(0, 3).map(markCard).join('')}</div>`,

      results: () => `<h1 class="text-2xl font-semibold">My Results</h1><p class="text-sm text-slate-500 mt-1 mb-4">Term 1, 2026</p>

<div class="bg-white rounded-xl shadow-sm overflow-x-auto"><table class="w-full text-sm"><thead class="bg-slate-50"><tr class="text-left text-xs uppercase tracking-wide font-semibold text-slate-600"><th scope="col" class="px-4 py-3">Subject</th><th scope="col" class="px-4 py-3 text-right">Average</th><th scope="col" class="px-4 py-3 text-right">Grade</th></tr></thead><tbody>${RES.map(r => `<tr class="border-t border-slate-200 h-12 hover:bg-slate-50"><td class="px-4"><a href="#/subject/${r.id}" class="font-medium text-blue-700 hover:underline">${r.n}</a><div class="text-xs text-slate-500">${r.c} assessments</div></td><td class="px-4 text-right font-mono font-medium">${r.a.toFixed(1)}</td><td class="px-4 text-right">${badge(r.g)}</td></tr>`).join('')}</tbody></table></div>`,

      },
      reports: () => `<h1 class="text-2xl font-semibold mb-4">Report Cards</h1>
<section class="bg-white rounded-xl shadow-sm p-6 mb-6" aria-labelledby="sd"><div class="flex items-center gap-4 mb-4"><div class="h-14 w-14 rounded-full bg-blue-100 text-blue-700 flex items-center justify-center text-xl font-semibold">${S.fullName[0]}</div><div><h2 id="sd" class="text-lg font-semibold">${S.fullName}</h2><p class="text-sm text-slate-500">${S.school}</p></div></div>
<dl class="grid grid-cols-2 sm:grid-cols-3 gap-4 text-sm">${dt('Class', S.cls + ' ' + S.stream)}${dt('Admission no.', S.adm, 1)}${dt('Gender', S.gender)}${dt('Date of birth', S.dob)}${dt('Guardian', S.guardian)}${dt('Guardian phone', S.phone, 1)}</dl></section>
<div class="space-y-6">${REPORTS.map((r, i) => {
        const a = avgOf(r.subs); return `<article class="bg-white rounded-xl shadow-sm p-6" aria-labelledby="rp${i}">
<div class="flex items-start justify-between gap-3 mb-4"><div class="flex items-center gap-3"><span class="text-blue-600">${ico('M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8zM14 3v5h5', 'w-6 h-6')}</span><div><h2 id="rp${i}" class="font-semibold">${r.t} ${r.y}</h2><div class="text-xs text-slate-500">${r.cls} · Generated ${r.at}</div></div></div>
<button onclick="dl(${i})" class="inline-flex items-center gap-2 px-3 py-1.5 rounded-lg bg-blue-600 text-white text-sm font-semibold hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 shrink-0">${ico('M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3', 'w-4 h-4')}Download PDF</button></div>
<div class="grid grid-cols-3 gap-3 text-center mb-4"><div class="bg-blue-50 rounded-lg py-3"><div class="font-mono text-xl font-semibold text-blue-700">${a.toFixed(1)}</div><div class="text-xs text-slate-500">Average %</div></div><div class="bg-blue-50 rounded-lg py-3"><div class="font-mono text-xl font-semibold text-blue-700">${gradeOf(a)}</div><div class="text-xs text-slate-500">Grade</div></div><div class="bg-blue-50 rounded-lg py-3"><div class="font-mono text-xl font-semibold text-blue-700">${r.pos}/${r.of}</div><div class="text-xs text-slate-500">Position</div></div></div>
<div class="overflow-x-auto rounded-lg border border-slate-200"><table class="w-full text-sm"><thead class="bg-slate-50"><tr class="text-left text-xs uppercase tracking-wide font-semibold text-slate-600"><th scope="col" class="px-4 py-3">Subject</th><th scope="col" class="px-4 py-3 text-right">Average</th><th scope="col" class="px-4 py-3 text-right">Grade</th><th scope="col" class="px-4 py-3">Remark</th></tr></thead><tbody>${r.subs.map(s => `<tr class="border-t border-slate-200 h-11"><td class="px-4 font-medium">${s.n}</td><td class="px-4 text-right font-mono">${s.a.toFixed(1)}</td><td class="px-4 text-right">${badge(s.g)}</td><td class="px-4 text-slate-600">${remarkOf(s.g)}</td></tr>`).join('')}</tbody></table></div>

      profile: () => `<h1 class="text-2xl font-semibold mb-4">My Profile</h1>

<section class="bg-white rounded-xl shadow-sm p-6"><h2 class="text-lg font-semibold mb-4">Change password</h2><div class="space-y-4"><div class="space-y-1"><label for="cp" class="block text-sm font-medium text-slate-700">Current password <span class="text-red-600">*</span></label><input id="cp" type="password" class="${INP}"></div><div class="space-y-1"><label for="np" class="block text-sm font-medium text-slate-700">New password <span class="text-red-600">*</span></label><input id="np" type="password" class="${INP}"><p class="text-xs text-slate-500">At least 8 characters.</p></div><button onclick="toast('Password updated.','success')" class="${BTN}">Update password</button></div></section>`
    };
    const login = () => `<main class="max-w-md mx-auto px-4 py-12"><div class="text-center mb-8"><div class="flex justify-center mb-4"><svg class="h-14 w-14" viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="#2563EB"/><path d="M8 22V10l8 8 8-8v12" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div><h1 class="text-[32px] leading-tight font-bold text-blue-700">Student Portal</h1><p class="text-sm text-slate-500 mt-2">Sign in to see your marks and reports.</p></div>

    function shell(page, html) {
      const links = NAV.map(([k, l]) => `<a href="#/${k}" class="px-3 py-2 rounded-lg ${page == k ? 'bg-blue-50 text-blue-700' : 'text-slate-600 hover:bg-slate-50'}">${l === 'Me' ? 'Profile' : l}</a>`).join('');
      const bn = NAV.map(([k, l, d]) => `<a href="#/${k}" class="flex flex-col items-center justify-center gap-1 ${page == k ? 'text-blue-600 font-semibold' : 'text-slate-500'}">${ico(d)}<span class="text-xs">${l}</span></a>`).join('');
      return `<header class="bg-white border-b border-slate-200 sticky top-0 z-40" style="top:env(safe-area-inset-top,0px)"><div class="max-w-3xl mx-auto px-4 h-14 flex items-center justify-between"><a href="#/dashboard" class="flex items-center gap-2">${logo}<span class="font-semibold text-blue-700">${S.school}</span></a><nav class="hidden md:flex items-center gap-1 text-sm font-medium" aria-label="Main">${links}</nav><a href="#/login" class="flex items-center gap-1 px-2 py-2 text-sm text-slate-600 hover:text-slate-900 rounded-lg">${ico('M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9')}<span class="hidden sm:inline">Log out</span></a></div></header>
<main class="view max-w-3xl mx-auto px-4 py-6">${html}</main>
<nav class="md:hidden fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 z-40" style="padding-bottom:env(safe-area-inset-bottom,0px)" aria-label="Bottom"><div class="grid grid-cols-5 h-16">${bn}</div></nav>`;
    }
    function toast(m, t) {const c = {success: 'bg-emerald-600', info: 'bg-blue-600', error: 'bg-red-600'}[t] || 'bg-blue-600'; const e = document.createElement('div'); e.setAttribute('role', 'status'); e.className = 'max-w-sm rounded-lg px-4 py-3 text-sm text-white shadow-lg ' + c; e.textContent = m; document.getElementById('toasts').appendChild(e); setTimeout(() => e.remove(), 5000)}
    function route() {
      const [, page = 'login', arg] = location.hash.split('/'); const app = document.getElementById('app');
      if (page === 'login') {app.innerHTML = login(); document.body.style.background = 'linear-gradient(#EFF6FF,#fff)'; return }
      document.body.style.background = '#F8FAFC';
      const f = P[page] || P.dashboard; app.innerHTML = shell(page === 'subject' ? 'results' : page, f(arg)); window.scrollTo(0, 0);
      if (page === 'dashboard' || !P[page]) initCarousel();
    }
    addEventListener('hashchange', route); route();
